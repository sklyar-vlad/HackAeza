name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        id: go
        if: hashFiles('backend/go.mod') != ''
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9
        if: steps.go.outcome == 'success'
        with:
          version: v2.14.0
          working-directory: backend
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: Go tests
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        working-directory: backend
        run: go test -race -count=1 -timeout=5m ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        id: node
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Frontend checks
        if: steps.node.outcome == 'success'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:ci
          npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deployment not ready
        if: hashFiles('infra/compose.yaml') == ''
        run: echo '::notice::Deploy skipped until infra/compose.yaml exists.'

      - name: Deploy to VPS
        if: hashFiles('infra/compose.yaml') != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}" "${VPS_USER:?Set VPS_USER}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}"
          umask 077
          ssh_key="$RUNNER_TEMP/vps_key"
          known_hosts="$RUNNER_TEMP/vps_known_hosts"
          trap 'rm -f "$ssh_key" "$known_hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"

          ssh -i "$ssh_key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            "$VPS_USER@$VPS_HOST" "bash -se -- '$GITHUB_SHA'" <<'DEPLOY'
          set -euo pipefail
          cd /srv/HackAeza-dev
          git diff --quiet
          git diff --cached --quiet
          git fetch origin main
          git switch --detach "$1"
          if [ ! -f infra/.env ]; then
            if [ -f .env ]; then
              mv .env infra/.env
            else
              cp infra/.env.example infra/.env
            fi
          fi
          docker compose --env-file infra/.env -f infra/compose.yaml -p hackaeza config --quiet
          docker compose --env-file infra/.env -f infra/compose.yaml -p hackaeza build
          docker compose --env-file infra/.env -f infra/compose.yaml -p hackaeza up -d --no-build --wait --wait-timeout 120
          DEPLOY
