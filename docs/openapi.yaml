    price.
  missingFields: DEFAULT из SQL не заменяют обязательные поля JSON. performedAt обязателен, но может быть null.
  snapshot: Полная замена; ссылки проверяются внутри снимка. Пустые массивы допустимы. Ошибки значений и связей
    дают 422 без изменения старого снимка.
