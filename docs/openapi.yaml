x-source-validation:
  idUniqueness: ID уникальны внутри каждой сущности; положительные int64.
  emailUniqueness: Email уникальны внутри accounts с учётом регистра, как UNIQUE(email) PostgreSQL.
  relations:
  - services.ownerId -> accounts.id
  - transactions.serviceId -> services.id
  serviceDates: expiresAt >= createdAt.
  transactionDates: performed требует performedAt >= createdAt; not_performed требует performedAt=null.
  money: Все деньги — целые евроценты; amount 0..1000 независимо от service.price. Балансы и price неотрицательны.
  noInferredConstraints: Не требуются withdrawBalance <= balance, totalReplenished >= balance или amount =
    price.
  missingFields: DEFAULT из SQL не заменяют обязательные поля JSON. performedAt обязателен, но может быть null.
  snapshot: Полная замена; ссылки проверяются внутри снимка. Пустые массивы допустимы. Ошибки значений и связей
    дают 422 без изменения старого снимка.
