      type: object
      required:
      - path
      - message
      properties:
        path:
          type: string
          example: services[0].ownerId
        message:
          type: string
          example: Аккаунт с таким ID отсутствует в снимке.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
            requestId:
