name: hackaeza

x-postgres-client: &postgres-client
  POSTGRES_URL: ${POSTGRES_URL:-postgres://?sslmode=disable}
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-hackaeza}
  PGUSER: ${POSTGRES_USER:-hackaeza}
  PGPASSWORD: ${POSTGRES_PASSWORD:-hackaeza-local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackaeza}
      POSTGRES_USER: ${POSTGRES_USER:-hackaeza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackaeza-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  goose:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: goose
    environment:
      <<: *postgres-client
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${POSTGRES_URL:-postgres://?sslmode=disable}
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ../backend/migrations:/migrations:ro
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      HTTP_PORT: ${HTTP_PORT:-8081}
    depends_on:
      backend:
        condition: service_healthy
      swagger:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      <<: *postgres-client
      HTTP_PORT: ${HTTP_PORT:-8081}
    depends_on:
      goose:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${HTTP_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  swagger:
    build:
      context: ..
      dockerfile: swagger/Dockerfile
    environment:
      HTTP_PORT: ${HTTP_PORT:-8081}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
