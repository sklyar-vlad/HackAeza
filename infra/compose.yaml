name: hackaeza

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - swagger
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      HTTP_PORT: ${HTTP_PORT:-8081}
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${HTTP_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  swagger:
    build:
      context: ..
      dockerfile: swagger/Dockerfile
    ports:
      - "8080:8080"
