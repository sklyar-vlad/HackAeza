name: hackaeza

x-backend-build: &backend-build
  context: ..
  dockerfile: infra/Dockerfile.backend

x-database-env: &database-env
  DATABASE_URL: postgres://hackaeza@postgres:5432/hackaeza?sslmode=disable
  PGPASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/setup-env.sh first}

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      HTTP_PORT: ${HTTP_PORT:-8081}
    depends_on:
      backend:
        condition: service_healthy
      swagger:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: *backend-build
    environment:
      <<: *database-env
      HTTP_PORT: ${HTTP_PORT:-8081}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8081}:${HTTP_PORT:-8081}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${HTTP_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  migrate:
    build: *backend-build
    environment: *database-env
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hackaeza
      POSTGRES_USER: hackaeza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/setup-env.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackaeza -d hackaeza"]
      interval: 5s
      timeout: 3s
      retries: 5

  swagger:
    build:
      context: ..
      dockerfile: swagger/Dockerfile
    environment:
      HTTP_PORT: ${HTTP_PORT:-8081}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
