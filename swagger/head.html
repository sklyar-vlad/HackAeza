<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
/>
<script>
  // Theme is shared with the panel, which serves the docs on the same origin under /docs.
  try {
    const theme = JSON.parse(localStorage.getItem("aeza-risk-prefs")).state
      .theme;
    if (theme) document.documentElement.dataset.theme = theme;
  } catch {}
  document.documentElement.dataset.theme ||= matchMedia(
    "(prefers-color-scheme: dark)",
  ).matches
    ? "dark"
    : "light";
</script>
<link rel="stylesheet" href="./docs.css" />
